plugins {
    id 'java-library'
    id 'maven-publish'
    // ModDevGradle's legacy-Forge plugin rather than the ForgeGradle 5 that Functional Storage 1.20.1
    // builds with: same DSL as the 1.21.1 build, so the two branches' build files stay comparable.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

// 1.20.1 runs on Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The backport is done step by step (PORTING.md §6), and a file joins the build when its step ports
// it - the rest of the 1.21.1 tree stays in place, untouched, until then. The list is the progress.
sourceSets.main.java {
    // Step 1 - spike: capability, zero-slot tile, controller network.
    include 'dev/drimoz/immaterialdrawers/ImmaterialDrawers.java'
    include 'dev/drimoz/immaterialdrawers/IDConfig.java'
    include 'dev/drimoz/immaterialdrawers/compat/Mods.java'
    include 'dev/drimoz/immaterialdrawers/registry/IDContent.java'
    include 'dev/drimoz/immaterialdrawers/block/ImmaterialDrawerBlock.java'
    include 'dev/drimoz/immaterialdrawers/block/energy/EnergyDrawerBlock.java'
    include 'dev/drimoz/immaterialdrawers/block/tile/ImmaterialDrawerTile.java'
    include 'dev/drimoz/immaterialdrawers/block/tile/energy/EnergyDrawerTile.java'
    include 'dev/drimoz/immaterialdrawers/storage/BigEnergyStorage.java'
    include 'dev/drimoz/immaterialdrawers/storage/ControllerEnergyStorage.java'
    include 'dev/drimoz/immaterialdrawers/storage/EnergyScaling.java'
    include 'dev/drimoz/immaterialdrawers/util/EnergyFormat.java'
    include 'dev/drimoz/immaterialdrawers/gametest/IDGameTests.java'
    // Step 3 - framed, recipes, config switches, client, datagen.
    include 'dev/drimoz/immaterialdrawers/block/energy/FramedEnergyDrawerBlock.java'
    include 'dev/drimoz/immaterialdrawers/block/tile/energy/FramedEnergyDrawerTile.java'
    include 'dev/drimoz/immaterialdrawers/recipe/FramedDrawerRecipe.java'
    include 'dev/drimoz/immaterialdrawers/registry/IDFeatures.java'
    include 'dev/drimoz/immaterialdrawers/client/IDClientSetup.java'
    include 'dev/drimoz/immaterialdrawers/client/IDColors.java'
    include 'dev/drimoz/immaterialdrawers/client/EnergyDrawerRenderer.java'
    include 'dev/drimoz/immaterialdrawers/client/gui/EnergyDrawerInfoGuiAddon.java'
    include 'dev/drimoz/immaterialdrawers/datagen/*.java'
    // Step 4 - Wireless Charger.
    include 'dev/drimoz/immaterialdrawers/augment/WirelessChargerItem.java'
    // Step 5 - probes.
    include 'dev/drimoz/immaterialdrawers/compat/jade/*.java'
    include 'dev/drimoz/immaterialdrawers/compat/top/*.java'
    // Step 6 - Source Drawer (Ars Nouveau, optional) and the framing shared by every framed drawer.
    include 'dev/drimoz/immaterialdrawers/block/IDFramedBlock.java'
    include 'dev/drimoz/immaterialdrawers/block/tile/IDFramedTile.java'
    include 'dev/drimoz/immaterialdrawers/**/source/*.java'
    include 'dev/drimoz/immaterialdrawers/registry/IDSourceContent.java'
    include 'dev/drimoz/immaterialdrawers/client/Source*.java'
    include 'dev/drimoz/immaterialdrawers/client/TankVolume.java'
    include 'dev/drimoz/immaterialdrawers/client/gui/SourceDrawerInfoGuiAddon.java'
    include 'dev/drimoz/immaterialdrawers/gametest/IDSourceGameTests.java'
    // Step 7 - chemical drawers (Mekanism 10.4, optional): one drawer for the four chemical types.
    include 'dev/drimoz/immaterialdrawers/**/chemical/*.java'
    include 'dev/drimoz/immaterialdrawers/registry/IDChemicalContent.java'
    include 'dev/drimoz/immaterialdrawers/client/Chemical*.java'
    include 'dev/drimoz/immaterialdrawers/client/gui/ChemicalDrawerInfoGuiAddon.java'
    include 'dev/drimoz/immaterialdrawers/util/ChemicalFormat.java'
    include 'dev/drimoz/immaterialdrawers/gametest/IDChemicalGameTests.java'
    // Shared by every drawer: their screen layout and the controller's network walk.
    include 'dev/drimoz/immaterialdrawers/client/gui/DrawerFaceGuiAddon.java'
    include 'dev/drimoz/immaterialdrawers/storage/ControllerNetwork.java'
}

legacyForge {
    version = project.forge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-1.20.1')
            // `-PquickPlay="World Name"` opens straight into a saved world, as on 1.21.1.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = project.file('run-1.20.1')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        // Same acceptance run as on 1.21.1: every game test, headless, non-zero exit on failure.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (Titanium, JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // Functional Storage publishes to no public maven - see the 1.21.1 build.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// On legacy Forge every mod jar is SRG-named and has to be remapped to the dev names: the `mod*`
// configurations do that. A plain `implementation` of a mod jar compiles against the wrong names.
dependencies {
    // Hard dependencies, never bundled (Titanium is LGPLv3; Functional Storage is what we extend).
    modImplementation "com.hrznstudio:titanium:${titanium_version}"
    modImplementation "maven.modrinth:functional-storage:${functionalstorage_version}"

    // Optional mods: compiled against, loaded only behind compat/Mods (CLAUDE.md §16).
    modCompileOnly "maven.modrinth:jade:${jade_version}"
    modCompileOnly "maven.modrinth:the-one-probe:${top_version}"
    modCompileOnly "maven.modrinth:mekanism:${mekanism_version}"
    modCompileOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
    modCompileOnly "maven.modrinth:botania:${botania_version}"

    // Dev runs: added back mod by mod as each step needs them, not all at once - a launch that fails
    // on a missing transitive dependency says nothing about our code.
    //
    // Powah (step 2): a real receiver from a real mod, for pushingEnergyNeverCreatesIt.
    modRuntimeOnly "maven.modrinth:powah:${powah_version}"
    modRuntimeOnly "maven.modrinth:architectury-api:${architectury_version}"
    modRuntimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    // Jade and TOP (step 5): the plugins are only real once the mods load them.
    modRuntimeOnly "maven.modrinth:jade:${jade_version}"
    modRuntimeOnly "maven.modrinth:the-one-probe:${top_version}"
    // Ars Nouveau (step 6) and its two hard dependencies. `-PnoArs` drops them, to exercise the
    // "absent" path: the mod must load and register nothing Source.
    // Mekanism (step 7). `-PnoMekanism` drops it: the mod must load and register nothing chemical.
    if (!project.hasProperty('noMekanism')) {
        modRuntimeOnly "maven.modrinth:mekanism:${mekanism_version}"
    }
    if (!project.hasProperty('noArs')) {
        modRuntimeOnly "maven.modrinth:ars-nouveau:${ars_nouveau_version}"
        modRuntimeOnly "maven.modrinth:curios:${curios_version}"
        modRuntimeOnly "maven.modrinth:geckolib:${geckolib_version}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
// Generated resources are committed, so a clone builds without running datagen first.
sourceSets.main.resources.srcDir 'src/generated/resources'
processResources { exclude '.cache/**' }
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
    from(file('NOTICE')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    // The port is measured by its error count (PORTING.md); javac's default stops at 100.
    options.compilerArgs << '-Xmaxerrs' << '100000'
}
