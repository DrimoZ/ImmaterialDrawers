org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 1.21.1 is not a choice, it is where Functional Storage is. This mod cannot be newer than the
# mod it extends.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
# Bounded above on purpose. [21.1,) would accept NeoForge 26.x; [1.21.1,1.22) would have accepted
# ten drops of breaking changes. Lesson already paid for on a previous mod - see CLAUDE.md §4.
neo_version_range=[21.1,21.2)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

mod_id=immaterialdrawers
mod_name=Immaterial Drawers
# Shown verbatim in the in-game mod list, so it states both halves - saying just "MIT" there
# would be a claim about the assets that LICENSE-ASSETS contradicts.
mod_license=MIT (code) / All Rights Reserved (assets)
mod_version=0.1.0
mod_group_id=dev.drimoz.immaterialdrawers
mod_authors=DrimoZ
mod_description=Drawers for what you can't hold. Energy first, more to come.

# Titanium is a hard dependency, not a convenience: ControllableDrawerTile extends its ActiveTile,
# and this exact version is the one Functional Storage itself compiles against.
titanium_version=1.21-4.0.34
# Functional Storage. The source read for the design brief is branch 1.21 at mod_version 1.5.8,
# which has no published build yet - 1.5.7 is the newest release, and what we compile against.
functionalstorage_version=1.21-1.5.7

# Dev-environment only (runtimeOnly), never shipped and never compiled against. These exist to
# answer one question the game tests cannot: does a real cable, from a real mod, actually move FE
# in and out of this block?
#
# Powah over Mekanism, which is what was asked for: Powah is small, its energy is plain FE with no
# unit conversion in the way, and it has all three things a test needs - a generator, cables, and
# energy cells to compare against. Mekanism stores Joules and converts at the boundary, so a
# failure there is ambiguous.
#
# Jade, because it reads the EnergyStorage capability off any block and shows it on the crosshair.
# It is the fastest way to see whether the capability answers at all, and it is also the mod
# CLAUDE.md §11 flags for a real integration later.
# Powah's own hard dependencies. Declared here rather than left to resolve themselves: a
# runtimeOnly maven coordinate brings the jar, not the mods the jar needs, and FML fails the whole
# launch rather than skipping the mod.
powah_version=6.2.10-neoforge
guideme_version=21.1.17
cloth_config_version=15.0.140+neoforge
jade_version=15.10.6+neoforge

# The One Probe, the other probe mod (CLAUDE.md §11bis). compileOnly for the plugin in compat/top,
# runtimeOnly so the dev run can actually show it.
top_version=1.21_neo-12.0.8

# Showcase run only (./gradlew runClient -Pshowcase): scenery for store screenshots. Mekanism for
# machines and cables a tech player recognises, Sodium + Iris so a shader pack can light them.
# Iris 1.8.12 pins Sodium 0.6.13 - move them together or not at all.
mekanism_version=10.7.19.85
sodium_version=mc1.21.1-0.6.13-neoforge
iris_version=1.8.12+1.21.1-neoforge
