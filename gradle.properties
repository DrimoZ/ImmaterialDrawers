org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 1.20.1 backport branch (PORTING.md). Forge, not NeoForge: Functional Storage 1.20.1 is published
# for Forge only, and this mod cannot run on a loader the mod it extends does not.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=1.20.1-47.4.23
# Bounded above for the same reason as on 1.21.1 (CLAUDE.md §4): 47 is the whole 1.20.1 line.
forge_version_range=[47.2,48)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

mod_id=immaterialdrawers
mod_name=Immaterial Drawers
# Shown verbatim in the in-game mod list, so it states both halves - saying just "MIT" there
# would be a claim about the assets that LICENSE-ASSETS contradicts.
mod_license=MIT (code) / All Rights Reserved (assets)
mod_version=0.2.0
mod_group_id=dev.drimoz.immaterialdrawers
mod_authors=DrimoZ
mod_description=Drawers for what you can't hold: Forge Energy, and with their mods, Mekanism chemicals and Ars Nouveau Source.

# Titanium is a hard dependency, not a convenience: ControllableDrawerTile extends its ActiveTile,
# and this exact version is the one Functional Storage itself compiles against.
titanium_version=1.20.1-3.8.35
# Functional Storage. The source read for the design brief is branch 1.21 at mod_version 1.5.8,
# which has no published build yet - 1.5.7 is the newest release, and what we compile against.
functionalstorage_version=1.20.1-1.2.14

# Dev-environment only (runtimeOnly), never shipped and never compiled against. These exist to
# answer one question the game tests cannot: does a real cable, from a real mod, actually move FE
# in and out of this block?
#
# Powah over Mekanism, which is what was asked for: Powah is small, its energy is plain FE with no
# unit conversion in the way, and it has all three things a test needs - a generator, cables, and
# energy cells to compare against. Mekanism stores Joules and converts at the boundary, so a
# failure there is ambiguous.
#
# Jade, because it reads the EnergyStorage capability off any block and shows it on the crosshair.
# It is the fastest way to see whether the capability answers at all, and it is also the mod
# CLAUDE.md §11 flags for a real integration later.
powah_version=5.0.11-forge
# Powah's own hard dependencies on 1.20.1: a runtimeOnly coordinate brings the jar, not what it needs.
architectury_version=9.2.14+forge
cloth_config_version=11.1.136+forge
jade_version=11.13.3+forge

# The One Probe, the other probe mod (CLAUDE.md §11bis). compileOnly for the plugin in compat/top,
# runtimeOnly so the dev run can actually show it.
top_version=1.20.1-10.0.4

# Mekanism, optional (Chemical Drawers). 10.4 is the last 1.20.1 line, and predates the unified
# Chemical API of 10.7: gases, infusion types, pigments and slurries are four handlers here.
mekanism_version=10.4.16.80

# Ars Nouveau, optional (Source Drawer). 4.12 is the 1.20.1 line.
ars_nouveau_version=4.12.7
# Botania exists on 1.20.1 and on nothing newer - the Mana Drawer is this branch's own (PORTING.md).
botania_version=1.20.1-456-forge
# Ars Nouveau 4.12's hard dependencies, by Modrinth version id: GeckoLib ships one number for several loaders.
curios_version=IPQlZkz1
geckolib_version=aC5KMoNg
