modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/DrimoZ/ImmaterialDrawers/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/DrimoZ/ImmaterialDrawers"
logoFile = "logo.png"
logoBlur = false
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Functional Storage is the mod this one extends - without it there is nothing here to add to,
# and half our class hierarchy has no supertype. AFTER, because our blocks are registered into
# its drawer types and its registries must exist first.
[[dependencies.${mod_id}]]
modId = "functionalstorage"
mandatory = true
versionRange = "[1.2.14,)"
ordering = "AFTER"
side = "BOTH"

# Titanium ships as its own jar and is never bundled (LGPLv3). Functional Storage requires it
# too, so in practice it is always present - it is declared here anyway so a missing copy is a
# loader message and not a NoClassDefFoundError.
[[dependencies.${mod_id}]]
modId = "titanium"
mandatory = true
versionRange = "[3.8.35,)"
ordering = "AFTER"
side = "BOTH"

# Mekanism is optional: with it, the Chemical Drawers exist; without it, they are never registered
# and no class that touches its API is ever loaded (CLAUDE.md §16). Declared anyway, for two reasons.
# 10.4 is the last Mekanism line for 1.20.1: four chemical handlers (gas, infusion, pigment, slurry),
# not the unified Chemical API of 10.7. Bounded above because the 1.20.1 line is closed - there is no
# 10.5 to refuse. AFTER, so its chemical registries exist before our blocks are built.
[[dependencies.${mod_id}]]
modId = "mekanism"
mandatory = false
versionRange = "[10.4,10.5)"
ordering = "AFTER"
side = "BOTH"

# Ars Nouveau is optional, for the Source Drawer - same reasoning as Mekanism above. 4.12 is the
# 1.20.1 line: ISourceTile and SourceManager, and no ISourceCap - that capability arrived in 5.x.
[[dependencies.${mod_id}]]
modId = "ars_nouveau"
mandatory = false
versionRange = "[4.12,4.13)"
ordering = "AFTER"
side = "BOTH"
